name: 'Haibun unit tests'

# A pull request and a dispatch build, lint and run the unit and end-to-end tests. A push doesn't start a run. A pull request
# that changes only documents still runs, since the prose check reads them.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  unit_test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Optional: Caching npm dependencies can speed up your builds
          cache: 'npm'

      - name: Install main deps
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run the groups of features
        run: npm run test:e2e
