name: 'Haibun CI'

on:
  workflow_dispatch:
  push:
    branches:
      - 3.x
      - alpha
      - beta
      - rc
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install main deps
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run e2e tests
        run: |
          cd e2e-tests
          npm ci
          npm test

  release:
    if: ${{ github.event_name == 'push' && contains(fromJSON('["3.x","alpha","beta","rc"]'), github.ref_name) }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate release-app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Remove deprecated npm always-auth config
        run: npm config delete always-auth || true

      - name: Install main deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify environment
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/verify-environment.sh

      - name: Diagnose app token identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          probe_path=".github/diag/probe-${{ github.run_id }}.txt"
          probe_content_b64=$(printf 'diagnostic probe' | base64 -w0)
          echo "=== Contents API PUT to 3.x: $probe_path ==="
          put_response=$(gh api -X PUT "/repos/${{ github.repository }}/contents/$probe_path" \
            -f message="diag: probe write to 3.x via Contents API [skip ci]" \
            -f content="$probe_content_b64" \
            -f branch="3.x" \
            --include 2>&1)
          echo "$put_response" | head -1
          echo "$put_response" | grep -iE '"message"|"documentation_url"' | head -5
          content_sha=$(echo "$put_response" | sed -n 's/^.*"content":[[:space:]]*{[^}]*"sha":[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          echo "Created content sha: ${content_sha:-<none>}"
          if [ -n "$content_sha" ]; then
            echo "=== Contents API DELETE on 3.x: $probe_path ==="
            del_response=$(gh api -X DELETE "/repos/${{ github.repository }}/contents/$probe_path" \
              -f message="diag: cleanup probe [skip ci]" \
              -f sha="$content_sha" \
              -f branch="3.x" \
              --include 2>&1)
            echo "$del_response" | head -1
            echo "$del_response" | grep -iE '"message"|"documentation_url"' | head -5
          else
            echo "Skipping delete — PUT did not return a content sha."
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN is not set; cannot publish."
            exit 1
          fi
          npx semantic-release