name: 'Haibun CI'

on:
  workflow_dispatch:
  push:
    branches:
      - 3.x
      - alpha
      - beta
      - rc
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install main deps
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run e2e tests
        run: |
          cd e2e-tests
          npm ci
          npm test

  release:
    if: ${{ github.event_name == 'push' && contains(fromJSON('["3.x","alpha","beta","rc"]'), github.ref_name) }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate release-app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Remove deprecated npm always-auth config
        run: npm config delete always-auth || true

      - name: Install main deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify environment
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/verify-environment.sh

      - name: Diagnose app token identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          echo "=== /installation/repositories ==="
          gh api /installation/repositories --jq '{total_count, repositories: [.repositories[].full_name]}'
          echo "=== ruleset bypass actors (admin:read needed) ==="
          gh api /repos/${{ github.repository }}/rulesets/3116695 --jq '.bypass_actors'
          echo "=== probe: try to create a throwaway ref via Contents:Write ==="
          sha=$(gh api /repos/${{ github.repository }}/git/refs/heads/3.x --jq '.object.sha')
          echo "3.x SHA: $sha"
          probe_ref="refs/heads/diag/app-write-probe-${{ github.run_id }}"
          echo "Probe ref: $probe_ref"
          create_status=$(gh api -X POST /repos/${{ github.repository }}/git/refs \
            -f ref="$probe_ref" -f sha="$sha" \
            --include 2>&1 | head -1)
          echo "Create response status: $create_status"
          echo "=== probe: delete the throwaway ref ==="
          delete_out=$(gh api -X DELETE /repos/${{ github.repository }}/git/${probe_ref#refs/} --include 2>&1 | head -1)
          echo "Delete response status: $delete_out"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN is not set; cannot publish."
            exit 1
          fi
          npx semantic-release