name: 'Publish all (manual)'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (omit for @latest)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Install main deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish all modules via OIDC Trusted Publishing
        run: node scripts/publish-all.mjs '${{ inputs.tag }}'
